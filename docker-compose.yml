services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/app
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./storage/audio:/app/storage/audio
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      DEV_USER_ID: ${DEV_USER_ID:-0}
      INIT_DB_ON_STARTUP: ${INIT_DB_ON_STARTUP:-true}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      SECRET_KEY: ${SECRET_KEY}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRANSCRIPTION_ENGINE: ${TRANSCRIPTION_ENGINE:-auto}
      ENABLE_HIGH_RISK_AI_FIELDS: ${ENABLE_HIGH_RISK_AI_FIELDS:-false}
      STORE_RAW_LLM_RESPONSES: ${STORE_RAW_LLM_RESPONSES:-false}
      AI_CONTEXT_RETENTION_DAYS: ${AI_CONTEXT_RETENTION_DAYS:-90}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${FRONTEND_URL:-http://localhost:8000}
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A src.worker worker --loglevel=info
    volumes:
      - .:/app
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./storage/audio:/app/storage/audio
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      DEV_USER_ID: ${DEV_USER_ID:-0}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TRANSCRIPTION_ENGINE: ${TRANSCRIPTION_ENGINE:-auto}
      ENABLE_HIGH_RISK_AI_FIELDS: ${ENABLE_HIGH_RISK_AI_FIELDS:-false}
      STORE_RAW_LLM_RESPONSES: ${STORE_RAW_LLM_RESPONSES:-false}
      AI_CONTEXT_RETENTION_DAYS: ${AI_CONTEXT_RETENTION_DAYS:-90}
    depends_on:
      - db
      - redis

  celery_flower:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A src.worker flower --port=5555 --basic_auth=${FLOWER_USER:-}:${FLOWER_PASSWORD:-}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
      - celery_worker

volumes:
  postgres_data:
  redis_data:
